[package]
name = "videocut"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "VideoCut : découpeur et convertisseur audio/vidéo simple, propulsé par FFmpeg"
authors = ["Clemzy"]
license = "MIT"
repository = "https://github.com/Clemzyy/VideoCut"
readme = "README.md"
keywords = ["video", "audio", "ffmpeg", "cutter", "waveform"]
categories = ["multimedia::video", "multimedia::audio"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui = "0.37"
cpal = "0.18"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
